spring:
  application:
    name: mcp-server

  http:
    codecs:
      max-in-memory-size: 52428800  # 50MB. 요청 본문을 메모리에 담을 수 있는 최대 크기. MCP 적재 요청의 Base64 내용도 여기에 걸린다(Base64 는 원본보다 약 1.33배 크다)

  main:
    # 기동 배너를 출력하지 않는다. stdio 방식 MCP 서버에서는 배너가 표준 출력의 MCP 메시지에 섞이므로
    # 끄는 것이 관례이다. Streamable HTTP 인 이 서버에서는 켜도 동작에 영향이 없다.
    banner-mode: off

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5434/mcpdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: update

  # Spring AI
  ai:
    # MCP Server (WebFlux - Reactive)
    mcp:
      server:
        # 서버가 스스로를 알리는 이름. 클라이언트 기동 로그와 MCP Inspector 에 보인다.
        # 지정하지 않으면 Spring AI 기본값 "mcp-server" 가 쓰인다.
        name: egovframe-rag-server
        type: ASYNC
        protocol: STREAMABLE
        # Sampling 등 서버→클라이언트 요청의 응답 대기 최대 시간 (기본 ~20s)
        #
        # 이 값은 클라이언트의 spring.ai.mcp.client.request-timeout(적재 도구 호출 전체 대기) 보다 반드시 짧아야 한다.
        # Sampling(문서 요약)은 적재의 일부인데 두 값이 같으면,
        # 요약이 느려지는 순간 호출자가 먼저 타임아웃되어 적재가 성공해도 화면에는 실패로 뜨는 경우 확인
        #
        # 요약은 document_metadata.summary 에 들어가는 부가 정보이고 검색에는 쓰이지 않는다.
        # 제때 못 받으면 "(요약 실패)" 로 두고 적재를 계속.
        request-timeout: 30s
        # MCP initialize 응답에 포함되는 서버 사용 안내.
        # VS Code·Claude Desktop·MCP Inspector 등 외부 클라이언트가 연결 즉시 수신.
        # 도구가 '무엇을 하는지'만 적는다. '언제 부를지'는 모델의 판단에 맡긴다.
        instructions: |
          이 서버는 RAG 지식 베이스 검색과 문서 적재를 제공합니다.
          - searchDocuments: 이 서버에 인덱싱된 문서에서 벡터 유사도로 관련 내용을 찾습니다.
          - describeKnowledgeBase: 인덱싱된 문서 현황을 조회합니다.
          - ingestDocument: PDF/DOCX/HWP/HWPX/MD/TXT를 인덱싱합니다.
            바이너리(PDF·DOCX·HWP·HWPX)는 Base64 로 보냅니다. 범용 MCP 클라이언트에서 LLM 이
            파일 내용을 옮겨 쓰는 경우에는 바이너리가 원본 그대로 전달되지 않기 쉬우므로
            텍스트(.md·.txt) 적재에 사용하세요.
        streamable-http:
          # 방화벽·프록시의 idle connection 강제 종료 방지용 주기적 ping
          keep-alive-interval: 30s

    # ONNX Embedding Model
    model:
      embedding: transformers

    embedding:
      transformer:
        onnx:
          modelUri: file:${EMBEDDING_MODEL_PATH:${user.home}/spring-ai-Config/model/model.onnx}
          modelOutputName: token_embeddings
        tokenizer:
          uri: file:${EMBEDDING_TOKENIZER_PATH:${user.home}/spring-ai-Config/model/tokenizer.json}
          options:
            padding: true
            truncation: true
            # 샘플 모델(ko-sroberta-multitask)의 상한과 동일한 값. app.document.chunk-size와 함께 조정해야 한다.
            # 주의: 이 값만 올려도 512를 넘길 수 없다. DJL HuggingFaceTokenizer는 maxLength > modelMaxLength이면
            #       modelMaxLength로 강제 하향하는데, modelMaxLength 옵션의 기본값이 512다(경고 로그 1줄만 남는다).
            #       컨텍스트가 더 긴 모델로 교체할 때는 modelMaxLength도 함께 지정할 것.
            #       예) maxLength: 2048 / modelMaxLength: 2048
            # 참고: tokenizer.json 자체에 truncation.max_length(=128)가 들어 있어도 이 옵션이 우선한다.
            maxLength: 512
            returnTensor: true

    # PGVector
    vectorstore:
      pgvector:
        initialize-schema: true
        remove-existing-vector-store-table: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768

# Server Port
server:
  port: 9090

# Logging
logging:
  level:
    root: INFO
    com.example.webflux: DEBUG
    org.springframework.ai: INFO
    io.modelcontextprotocol.util.KeepAliveScheduler: ERROR

# Document (custom namespace)
app:
  document:
    # 문서 적재 루트. 환경변수 DOCUMENT_BASE_PATH 로 지정한다.
    #
    # 기본값은 ${user.home} 기준이다. 특정 PC 절대경로를 여기 적지 말 것.
    # 그러면 이 파일을 고쳐야만 경로를 바꿀 수 있고, 그 수정이 커밋에 섞여 들어간다
    # 임베딩 모델 경로가 쓰는 방식과 동일하다.
    #   예) $env:DOCUMENT_BASE_PATH = "C:/my-docs"     (Windows PowerShell)
    #       export DOCUMENT_BASE_PATH=/var/lib/mcp/docs (Linux)
    base-path: ${DOCUMENT_BASE_PATH:${user.home}/egovframe-mcp/docs}
    path: file:${app.document.base-path}/**/*.md
    pdf-path: file:${app.document.base-path}/**/*.pdf
    txt-path: file:${app.document.base-path}/**/*.txt
    docx-path: file:${app.document.base-path}/**/*.docx
    hwp-path: file:${app.document.base-path}/**/*.hwp
    hwpx-path: file:${app.document.base-path}/**/*.hwpx
    pdf:
      page-top-margin: 0
      pages-per-document: 1
    # 청크 크기. 단위는 '문자'가 아니라 cl100k_base 토큰이다.
    # ※ 이 값은 사용하는 임베딩 모델에 종속된다. 모델을 교체하면 반드시 다시 산정할 것.
    #   모델 상한을 넘는 청크는 tokenizer.options.truncation:true 때문에 예외도 로그도 없이 뒷부분이 잘린 채 임베딩된다.
    #   아래 chunking.korean-sentence 를 켠 경로에도 같은 값이 그대로 적용된다.
    #
    #   산정 방법:
    #     1. 모델의 토큰 상한 확인(tokenizer_config.json 의 model_max_length)
    #        (spring.ai.embedding.transformer.tokenizer.options.maxLength 도 이 값에 맞춘다)
    #     2. cl100k 토큰 → 모델 토큰 환산비 확인 (토크나이저가 다르므로 1:1이 아니다)
    #     3. chunk-size ≒ 모델 상한 / 환산비, 여기에 안전 마진
    #
    #   현재 기본 구성(README의 ko-sroberta 계열 ONNX, 상한 512) 기준:
    #     측정 결과(한국어 마크다운) cl100k 4000토큰 ≒ 9,700자 ≒ 모델 5,000토큰 → 약 10%만 임베딩된다.
    #     환산비 약 1.25를 적용해 512 / 1.25 ≒ 410, 안전 마진을 두어 400.
    chunk-size: 400

    # 청크 경계를 마지막 문장부호(. ? ! 개행)까지 물릴 때의 하한선(문자 단위).
    # 이름과 달리 "이 크기 미만 문서는 나누지 않는다"는 뜻이 아니다. TokenTextSplitter 는
    # chunk-size 만큼 토큰으로 자른 뒤 문장 중간 절단을 피하려 뒤로 물러나는데,
    # 물러날 위치가 이 값보다 앞이면 물러나지 않는다(너무 짧은 청크가 생기는 것을 막는다).
    # 아래 chunking.korean-sentence 를 켜면 EgovKoreanSentenceSplitter 가 splitText() 를
    # 오버라이드해 이 로직 자체를 타지 않으므로 값이 무의미해진다. 문장 경계로 먼저 나누기
    # 때문에 물러날 일이 없다. 로그에는 그대로 찍히므로 혼동하지 말 것.
    min-chunk-size-chars: 350

    # 원본 문서 하나당 만들 청크 수 상한. 초과분은 버려진다.
    max-num-chunks: 500

    # 이 길이 이하의 청크는 임베딩하지 않고 버린다(문자 단위).
    min-chunk-length-to-embed: 50
    chunking:
      korean-sentence:
        # 활성화 여부. false(기본)이면 기존 TokenTextSplitter 방식 그대로 (기존 동작 유지)
        # 한국어가 위주인 문서에서 효과적이며, 영어 비중이 높은 문서에는 적합하지 않을 수 있음
        enabled: false
        # 주의: normalization.normalize-newlines 가 true(현재 이 프로젝트의 기본값)이면
        # 연속 개행이 정규화 단계에서 미리 1개로 축약되어, 빈 줄 기준 문단 경계 규칙이 동작하지 않는다.
        # 마크다운 블록 시작·코드펜스 경계는 단일 개행 기준이라 이 설정과 무관하게 정상 동작한다.
        # 문단 경계까지 온전히 쓰려면 아래 normalize-newlines 를 false 로 내려야 한다.
    normalization:
      enabled: true
      remove-html-tags: true
      normalize-whitespace: true
      normalize-newlines: true
      remove-code-blocks: false
      clean-special-chars: true
    # 민감정보(PII) 마스킹 (색인 저장 단계 보호). egovframe-ai-rag PR #39 와 같은 규칙이다.
    #
    # 두 적재 경로에 모두 정규화 뒤, 청크 분할 전에 한 번 적용된다.
    #   - MCP ingestDocument: Sampling 으로 클라이언트 LLM 에 보내기 전에 적용하고, 그 결과를 저장에도 쓴다
    #   - REST 재인덱싱: Sampling 이 없어 저장 전에만 적용
    # 정규화 뒤여야 하는 이유: 전각 공백·비줄바꿈 공백·제로폭 문자로 끊긴 번호는
    # 정규화가 그 문자를 ASCII 공백으로 바꾼 뒤에야 패턴에 걸린다.
    # 그래서 normalization.enabled 를 false 로 두면 그런 번호가 마스킹되지 않는다.
    # 켜기 전에 이미 적재된 문서는 바뀌지 않는다. 다시 적재해야 마스킹본으로 교체된다.
    # 해시는 원문 기준이라, 파일이 그대로면 '변경 없음'으로 건너뛴다. 재적재하려면 해당 문서의
    # document_metadata 를 지우고 다시 적재할 것.
    pii-masking:
      # 마스킹 활성화 여부 (기본 비활성. 필요할 때만 켠다)
      enabled: false
      # 주민등록번호/외국인등록번호 마스킹 여부 (검증자리 통과분만)
      mask-rrn: true
      # 카드번호 마스킹 여부 (Luhn 검사를 통과한 번호만 치환)
      mask-card: true
      # 인증키/비밀키(key=value) 값 마스킹 여부
      mask-secret: true
      # 치환 토큰
      rrn-token: "[RRN]"
      card-token: "[CARD]"
      secret-token: "[SECRET]"
      account-token: "[ACCOUNT]"
      # 계좌번호 정규식 (기관별 형식이 달라 오탐이 크므로 기본 미지정 = 비활성)
      account-regex: ""
  security:
    # 신뢰 클라이언트 API 키 목록.
    #
    # MCP 엔드포인트(/mcp) 전체에 필요하다. EgovApiSecurityFilter 가 HTTP 입구에서 검사하므로
    # 검색·조회·적재가 모두 막힌다. initialize 부터 403 이 되어 연결 자체가 실패한다.
    # (REST 에는 적재 엔드포인트가 없다. /api/documents 는 status·reindex 두 개뿐이고 키 검증도 없다.
    #  이 둘은 localhost 전용 규칙으로 따로 막는다.)
    #
    # 환경변수 MCP_API_KEY 미설정 시 빈 문자열 → 모든 MCP 요청 차단 (의도된 안전 기본값).
    api-keys:
      - "${MCP_API_KEY:}"

  rag:
    similarity-threshold: 0.30
    top-k: 5
    max-content-length: 2000
    hybrid:
      # 활성화 여부. 이 설정 파일은 true 로 켠다. 키를 지우면 코드 기본값 false 가 적용되어
      # dense 단일 검색만 사용한다.
      enabled: true
      # 채널별 RRF 가중치
      weight:
        dense: 1.0
        lexical: 1.0
      lexical:
        # pg_trgm.word_similarity_threshold (pg_trgm 기본값 0.6은 너무 엄격하다)
        # 참고 측정치: 청크 크기가 4000자이던 이전 설정에서 0.30 → recall@3 0.80 / 0.40 → 0.57 / 0.60 → 0.31.
        # 현재 chunk-size(400 토큰) 기준으로 다시 잰 값은 아니다. 문서와 청크 설정을 바꾸면 다시 측정한다.
        word-similarity-threshold: 0.30

# Springdoc (Swagger)
springdoc:
  paths-to-exclude: /mcp/**
